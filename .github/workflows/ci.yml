name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: Lint, typecheck, fast tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chemistry-video-service
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: chemistry-video-service/pyproject.toml

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg fonts-dejavu-core

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy app

      - name: Unit tests
        run: pytest tests/unit

      - name: Integration tests
        run: pytest tests/integration

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$null, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Host "::error file=$($_.Extent.File),line=$($_.Extent.StartLineNumber)::$($_.Message)" }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
          Write-Host "All PowerShell scripts parsed successfully."

  e2e:
    name: Real-pipeline E2E
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: chemistry-video-service
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: chemistry-video-service/pyproject.toml

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg fonts-dejavu-core

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run E2E tests
        run: pytest tests/e2e -m e2e

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-artifacts
          path: |
            chemistry-video-service/artifacts
            chemistry-video-service/downloads
          if-no-files-found: ignore
          retention-days: 7
